<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clientes — Protokol</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F0F2F5;color:#1a1a1a;font-size:16px;min-height:100vh}
.topbar{background:#0D1117;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.topbar h1{font-size:15px;font-weight:700;color:#fff}
.topbar span{font-size:11px;color:#4A5568}
.btn-icon{background:#1A1F2B;border:1px solid #252B38;border-radius:9px;padding:7px 11px;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}

/* VISTAS */
.view{display:none}
.view.active{display:block}

/* LISTA */
.search-wrap{padding:12px 16px 8px}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #E0E0E0;border-radius:11px;padding:10px 13px}
.search-box input{border:none;outline:none;font-size:15px;color:#1a1a1a;width:100%;background:transparent;font-family:inherit}
.search-box input::placeholder{color:#AAA}
.cli-list{padding:0 16px 80px}
.cli-card{background:#fff;border-radius:13px;padding:14px;margin-bottom:10px;border:1px solid #E8E8E8;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .12s}
.cli-card:active{border-color:#0A84FF;background:#F0F7FF}
.cli-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;color:#fff}
.cli-info{flex:1;min-width:0}
.cli-name{font-size:15px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli-sub{font-size:12px;color:#888;margin-top:2px}
.cli-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-ok{background:#E8F5E9;color:#2E7D32}
.badge-nd{background:#F5F5F5;color:#888}
.empty-state{text-align:center;padding:60px 24px;color:#888}
.empty-state p{font-size:15px;margin-top:8px}
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:#0A84FF;border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(10,132,255,.4);z-index:100}

/* FICHA */
.ficha-wrap{padding:0 16px 80px;margin-top:12px}
.ficha-hero{background:#0D1117;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.ficha-avatar-lg{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;color:#fff}
.ficha-hero-name{font-size:17px;font-weight:700;color:#fff}
.ficha-hero-cuit{font-size:12px;color:#4A5568;margin-top:2px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;border:1px solid #E8E8E8}
.card-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #F5F5F5;font-size:14px}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-key{color:#666;flex-shrink:0;padding-right:12px}
.info-val{color:#1a1a1a;font-weight:500;text-align:right;word-break:break-word;max-width:60%}
.info-val.accent{color:#185FA5}
.art-box{background:#F8F9FC;border:1px solid #E8E8E8;border-radius:10px;padding:12px;margin-top:4px}
.art-row{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid #EFEFEF;font-size:13px}
.art-row:last-child{border-bottom:none}
.art-key{color:#666}
.art-val{color:#1a1a1a;font-weight:500;font-family:monospace;font-size:12px;word-break:break-all;text-align:right;max-width:55%}
.badge-visita{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-top:6px}
.badge-visita.ok{background:#E8F5E9;color:#2E7D32}
.badge-visita.warn{background:#FFF8E1;color:#F57F17}
.btn-usar{width:100%;padding:14px;background:#0A84FF;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn-usar:active{background:#0070D8}
.btn-editar{width:100%;padding:13px;background:#fff;color:#1a1a1a;border:1.5px solid #E0E0E0;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:8px}
.btn-danger{width:100%;padding:13px;background:#fff;color:#C62828;border:1.5px solid #FFCDD2;border-radius:12px;font-size:14px;cursor:pointer}

/* FORMULARIO */
.form-wrap{padding:0 16px 80px;margin-top:12px}
label{font-size:14px;color:#444;font-weight:500;display:block;margin-bottom:5px;margin-top:14px}
label:first-of-type{margin-top:0}
label .req{color:#E24B4A;margin-left:2px}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=email],select,textarea{width:100%;padding:11px 13px;border:1.5px solid #DDD;border-radius:10px;font-size:15px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:#0A84FF;box-shadow:0 0 0 3px rgba(10,132,255,.1)}
textarea{min-height:60px;resize:none}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-save{width:100%;padding:15px;background:#0A84FF;color:#fff;border:none;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-save:active{background:#0070D8}
.btn-cancel{width:100%;padding:13px;background:#fff;color:#666;border:1.5px solid #DDD;border-radius:13px;font-size:15px;cursor:pointer;margin-top:8px}
.add-field-btn{width:100%;padding:9px;border:1.5px dashed #0A84FF;border-radius:9px;background:#F0F7FF;color:#0A84FF;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px}
.rm-btn{padding:6px 10px;border:1.5px solid #FFCDD2;border-radius:8px;background:#fff;color:#C62828;font-size:12px;cursor:pointer;margin-top:4px;float:right}
.sub-card{background:#F8F9FC;border:1px solid #E8E8E8;border-radius:10px;padding:12px;margin-bottom:8px;position:relative}
.sub-card-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.color-selector{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s}
.color-dot.sel{border-color:#333;transform:scale(1.15)}
.nota{background:#EBF4FF;border:1px solid #B5D4F4;border-radius:9px;padding:10px 12px;font-size:13px;color:#185FA5;line-height:1.5;margin-bottom:10px}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1 id="topbar-title">Mis clientes</h1>
    <span id="topbar-sub"></span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn-icon" id="back-btn" onclick="goBack()" style="display:none">‹ Volver</button>
  </div>
</div>

<!-- ══ LISTA ══════════════════════════════════════════ -->
<div id="view-lista" class="view active">
  <div class="search-wrap">
    <div class="search-box">
      <span style="font-size:18px;color:#AAA">🔍</span>
      <input type="text" id="search-input" placeholder="Buscar cliente..." oninput="filtrarClientes()">
    </div>
  </div>
  <div class="cli-list" id="cli-list"></div>
  <button class="fab" onclick="goNuevo()" title="Nuevo cliente">+</button>
</div>

<!-- ══ FICHA ══════════════════════════════════════════ -->
<div id="view-ficha" class="view">
  <div class="ficha-wrap" id="ficha-content"></div>
</div>

<!-- ══ FORMULARIO ════════════════════════════════════ -->
<div id="view-form" class="view">
  <div class="form-wrap" id="form-content"></div>
</div>

<script>
// ══ STORAGE ══════════════════════════════════════════
const STORE_KEY = 'protokol_clientes_v1';

function loadClientes() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e) { return []; }
}

function saveClientes(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

// ══ ESTADO ═══════════════════════════════════════════
let clientes = loadClientes();
let clienteActual = null;
let viewHistory = ['lista'];

const COLORES = [
  {bg:'#0c2240', text:'#60A5FA'},
  {bg:'#200a30', text:'#C084FC'},
  {bg:'#0a200a', text:'#86EFAC'},
  {bg:'#300a0a', text:'#FCA5A5'},
  {bg:'#1a1a0a', text:'#FCD34D'},
  {bg:'#0a1a0f', text:'#6EE7B7'},
  {bg:'#1a0c04', text:'#FB923C'},
  {bg:'#1A3A5C', text:'#90CAF9'},
];

function initials(nombre) {
  if (!nombre) return '?';
  return nombre.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function colorFor(idx) {
  return COLORES[idx % COLORES.length];
}

function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  const diff = (new Date() - new Date(dateStr + 'T12:00:00')) / 86400000;
  return Math.floor(diff);
}

// ══ NAVEGACIÓN ═══════════════════════════════════════
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  window.scrollTo(0, 0);
  document.getElementById('back-btn').style.display = id === 'lista' ? 'none' : 'flex';
}

function goBack() {
  viewHistory.pop();
  const prev = viewHistory[viewHistory.length - 1] || 'lista';
  if (prev === 'lista') {
    document.getElementById('topbar-title').textContent = 'Mis clientes';
    document.getElementById('topbar-sub').textContent = '';
    renderLista();
  } else if (prev === 'ficha') {
    renderFicha(clienteActual);
  }
  showView(prev);
}

// ══ LISTA ═════════════════════════════════════════════
function renderLista(filtro) {
  const cont = document.getElementById('cli-list');
  const lista = filtro
    ? clientes.filter(c => c.razonSocial.toLowerCase().includes(filtro.toLowerCase()))
    : clientes;

  document.getElementById('topbar-sub').textContent = '';

  if (lista.length === 0) {
    cont.innerHTML = `<div class="empty-state">
      <div style="font-size:40px">🏭</div>
      <p>${filtro ? 'Sin resultados para "' + filtro + '"' : 'Todavía no tenés clientes.<br>Tocá + para agregar el primero.'}</p>
    </div>`;
    return;
  }

  cont.innerHTML = lista.map((c, i) => {
    const idx = clientes.indexOf(c);
    const col = colorFor(c.colorIdx !== undefined ? c.colorIdx : idx);
    const dias = daysSince(c.ultimaVisita);
    let badge = '';
    if (dias === null) badge = `<span class="cli-badge badge-nd">Sin visitas</span>`;
    else if (dias <= 35) badge = `<span class="cli-badge badge-ok">Al día</span>`;
    else badge = `<span class="cli-badge" style="background:#FFF8E1;color:#F57F17">Hace ${dias}d</span>`;
    return `<div class="cli-card" onclick="verCliente(${idx})">
      <div class="cli-avatar" style="background:${col.bg};color:${col.text}">${initials(c.razonSocial)}</div>
      <div class="cli-info">
        <div class="cli-name">${c.razonSocial || '—'}</div>
        <div class="cli-sub">${c.establecimientos && c.establecimientos[0] ? c.establecimientos[0].direccion : (c.localidad || 'Sin dirección')}</div>
      </div>
      ${badge}
    </div>`;
  }).join('');
}

function filtrarClientes() {
  renderLista(document.getElementById('search-input').value);
}

// ══ FICHA ════════════════════════════════════════════
function verCliente(idx) {
  clienteActual = idx;
  renderFicha(idx);
  viewHistory.push('ficha');
  document.getElementById('topbar-title').textContent = clientes[idx].razonSocial || 'Cliente';
  document.getElementById('topbar-sub').textContent = '';
  showView('ficha');
}

function renderFicha(idx) {
  const c = clientes[idx];
  const col = colorFor(c.colorIdx !== undefined ? c.colorIdx : idx);
  const dias = daysSince(c.ultimaVisita);
  let badgeVisita = '';
  if (dias === null) badgeVisita = `<span class="badge-visita warn">Sin visitas registradas</span>`;
  else if (dias <= 35) badgeVisita = `<span class="badge-visita ok">✅ Visita al día (hace ${dias} días)</span>`;
  else badgeVisita = `<span class="badge-visita warn">⚠️ Hace ${dias} días sin visita</span>`;

  // Establecimientos
  let estHTML = '';
  if (c.establecimientos && c.establecimientos.length > 0) {
    c.establecimientos.forEach(e => {
      estHTML += `<div class="info-row">
        <span class="info-key">${e.nombre || 'Establecimiento'}</span>
        <span class="info-val accent">${e.direccion}</span>
      </div>`;
    });
  } else {
    estHTML = `<div class="info-row"><span class="info-key">Dirección</span><span class="info-val">—</span></div>`;
  }

  // Contactos
  let contHTML = '';
  if (c.contactos && c.contactos.length > 0) {
    c.contactos.forEach(ct => {
      contHTML += `<div class="info-row">
        <span class="info-key">${ct.rol || 'Contacto'}</span>
        <span class="info-val">${ct.nombre}${ct.telefono ? '<br><span style="color:#185FA5;font-size:12px">' + ct.telefono + '</span>' : ''}</span>
      </div>`;
    });
  } else {
    contHTML = `<div class="info-row"><span class="info-key">Contacto</span><span class="info-val">—</span></div>`;
  }

  // ART
  let artHTML = '';
  if (c.artNombre || c.artPoliza || c.artAccesos || c.artVto) {
    artHTML = `<div class="art-box">
      ${c.artNombre ? `<div class="art-row"><span class="art-key">ART</span><span class="art-val">${c.artNombre}</span></div>` : ''}
      ${c.artPoliza ? `<div class="art-row"><span class="art-key">N° póliza</span><span class="art-val">${c.artPoliza}</span></div>` : ''}
      ${c.artAccesos ? `<div class="art-row"><span class="art-key">Datos de acceso</span><span class="art-val">${c.artAccesos}</span></div>` : ''}
      ${c.artVto ? `<div class="art-row"><span class="art-key">Vto. póliza</span><span class="art-val">${formatDate(c.artVto)}</span></div>` : ''}
    </div>`;
  } else {
    artHTML = `<div style="font-size:13px;color:#888;margin-top:4px">Sin datos de ART cargados.</div>`;
  }

  document.getElementById('ficha-content').innerHTML = `
    <div class="ficha-hero">
      <div class="ficha-avatar-lg" style="background:${col.bg};color:${col.text}">${initials(c.razonSocial)}</div>
      <div>
        <div class="ficha-hero-name">${c.razonSocial || '—'}</div>
        <div class="ficha-hero-cuit">CUIT ${c.cuit || 'sin datos'}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Datos generales</div>
      <div class="info-row"><span class="info-key">Razón social</span><span class="info-val">${c.razonSocial || '—'}</span></div>
      <div class="info-row"><span class="info-key">CUIT</span><span class="info-val">${c.cuit || '—'}</span></div>
      <div class="info-row"><span class="info-key">Actividad / Rubro</span><span class="info-val">${c.actividad || '—'}</span></div>
      <div class="info-row"><span class="info-key">Trabajadores</span><span class="info-val">${c.trabajadores || '—'}</span></div>
    </div>

    <div class="card">
      <div class="card-title">Establecimientos</div>
      ${estHTML}
    </div>

    <div class="card">
      <div class="card-title">Contactos</div>
      ${contHTML}
    </div>

    <div class="card">
      <div class="card-title">ART contratada</div>
      ${artHTML}
    </div>

    <div class="card">
      <div class="card-title">Historial de visitas</div>
      <div class="info-row"><span class="info-key">Última visita</span><span class="info-val">${formatDate(c.ultimaVisita)}</span></div>
      <div class="info-row"><span class="info-key">Próxima visita</span><span class="info-val">${formatDate(c.proximaVisita)}</span></div>
      <div class="info-row"><span class="info-key">Frecuencia</span><span class="info-val">${c.frecuencia || '—'}</span></div>
      ${badgeVisita}
    </div>

    ${c.notas ? `<div class="card">
      <div class="card-title">Notas</div>
      <div style="font-size:14px;color:#444;line-height:1.6">${c.notas}</div>
    </div>` : ''}

    <div class="nota">Al tocar "Usar en herramienta" los datos de este cliente se copian al portapapeles listos para pegar, hasta que implementemos la precarga automática entre apps.</div>

    <button class="btn-usar" onclick="usarEnHerramienta(${idx})">📋 Copiar datos para herramienta</button>
    <button class="btn-editar" onclick="goEditar(${idx})">✏️ Editar cliente</button>
    <button class="btn-editar" onclick="registrarVisita(${idx})" style="color:#2E7D32;border-color:#C8E6C9">📅 Registrar visita hoy</button>
    <button class="btn-danger" onclick="eliminarCliente(${idx})">🗑️ Eliminar cliente</button>
  `;
}

function usarEnHerramienta(idx) {
  const c = clientes[idx];
  const est = c.establecimientos && c.establecimientos[0];
  const cont = c.contactos && c.contactos[0];
  let txt = `Cliente: ${c.razonSocial || ''}
CUIT: ${c.cuit || ''}
Dirección: ${est ? est.direccion : ''}
Trabajadores: ${c.trabajadores || ''}
Responsable: ${cont ? cont.nombre + (cont.rol ? ' (' + cont.rol + ')' : '') : ''}`;
  navigator.clipboard && navigator.clipboard.writeText(txt);
  const btn = document.querySelector('.btn-usar');
  btn.textContent = '✅ Copiado al portapapeles';
  setTimeout(() => btn.textContent = '📋 Copiar datos para herramienta', 2500);
}

function registrarVisita(idx) {
  const hoy = new Date().toISOString().split('T')[0];
  clientes[idx].ultimaVisita = hoy;
  saveClientes(clientes);
  renderFicha(idx);
  alert('Visita registrada para hoy.');
}

function eliminarCliente(idx) {
  if (!confirm('¿Eliminar este cliente? Esta acción no se puede deshacer.')) return;
  clientes.splice(idx, 1);
  saveClientes(clientes);
  goBack();
  renderLista();
}

// ══ FORMULARIO ═══════════════════════════════════════
let formData = {};
let editIdx = null;

function goNuevo() {
  editIdx = null;
  formData = {
    razonSocial:'', cuit:'', actividad:'', trabajadores:'',
    establecimientos:[{nombre:'Planta principal', direccion:''}],
    contactos:[{rol:'Responsable H&S', nombre:'', telefono:''}],
    artNombre:'', artPoliza:'', artAccesos:'', artVto:'',
    ultimaVisita:'', proximaVisita:'', frecuencia:'', notas:'',
    colorIdx: Math.floor(Math.random() * COLORES.length)
  };
  renderForm();
  viewHistory.push('form');
  document.getElementById('topbar-title').textContent = 'Nuevo cliente';
  showView('form');
}

function goEditar(idx) {
  editIdx = idx;
  formData = JSON.parse(JSON.stringify(clientes[idx]));
  if (!formData.establecimientos) formData.establecimientos = [{nombre:'', direccion:''}];
  if (!formData.contactos) formData.contactos = [{rol:'', nombre:'', telefono:''}];
  renderForm();
  viewHistory.push('form');
  document.getElementById('topbar-title').textContent = 'Editar cliente';
  showView('form');
}

function renderForm() {
  // Establecimientos
  let estHTML = formData.establecimientos.map((e, i) => `
    <div class="sub-card">
      <div class="sub-card-label">Establecimiento ${i+1}</div>
      ${formData.establecimientos.length > 1 ? `<button class="rm-btn" onclick="removeEst(${i})">✕ Quitar</button>` : ''}
      <label style="margin-top:0">Nombre / descripción</label>
      <input type="text" value="${esc(e.nombre)}" placeholder="Ej: Planta principal, Depósito, Sucursal" oninput="formData.establecimientos[${i}].nombre=this.value">
      <label>Dirección completa</label>
      <input type="text" value="${esc(e.direccion)}" placeholder="Calle, número, localidad, provincia" oninput="formData.establecimientos[${i}].direccion=this.value">
    </div>`).join('');

  // Contactos
  let contHTML = formData.contactos.map((ct, i) => `
    <div class="sub-card">
      <div class="sub-card-label">Contacto ${i+1}</div>
      ${formData.contactos.length > 1 ? `<button class="rm-btn" onclick="removeCont(${i})">✕ Quitar</button>` : ''}
      <label style="margin-top:0">Rol / cargo <span style="font-size:12px;color:#888;font-weight:400">(editable)</span></label>
      <input type="text" value="${esc(ct.rol)}" placeholder="Ej: Responsable H&S, Dueño, Supervisor, RRHH" oninput="formData.contactos[${i}].rol=this.value">
      <label>Nombre y apellido</label>
      <input type="text" value="${esc(ct.nombre)}" placeholder="Nombre completo" oninput="formData.contactos[${i}].nombre=this.value">
      <label>Teléfono</label>
      <input type="tel" value="${esc(ct.telefono)}" placeholder="Ej: 11 4523-1234" oninput="formData.contactos[${i}].telefono=this.value">
    </div>`).join('');

  // Colores
  let coloresHTML = COLORES.map((col, i) => `
    <div class="color-dot ${formData.colorIdx === i ? 'sel' : ''}"
      style="background:${col.bg};border-color:${formData.colorIdx === i ? col.text : 'transparent'}"
      onclick="selColor(${i})"></div>`).join('');

  document.getElementById('form-content').innerHTML = `
    <div class="card">
      <div class="card-title">Datos generales</div>
      <label style="margin-top:0">Razón social <span class="req">*</span></label>
      <input type="text" id="f-razon" value="${esc(formData.razonSocial)}" placeholder="Nombre de la empresa" oninput="formData.razonSocial=this.value">
      <label>CUIT</label>
      <input type="text" value="${esc(formData.cuit)}" placeholder="XX-XXXXXXXX-X" oninput="formData.cuit=this.value">
      <label>Actividad / Rubro</label>
      <input type="text" value="${esc(formData.actividad)}" placeholder="Ej: Metalúrgica, Depósito, Construcción" oninput="formData.actividad=this.value">
      <label>Cantidad de trabajadores</label>
      <input type="number" value="${formData.trabajadores}" placeholder="N° de empleados" min="1" oninput="formData.trabajadores=this.value">
      <label>Color de avatar</label>
      <div class="color-selector">${coloresHTML}</div>
    </div>

    <div class="card">
      <div class="card-title">Establecimientos</div>
      <div id="est-container">${estHTML}</div>
      <button class="add-field-btn" onclick="addEst()">+ Agregar establecimiento</button>
    </div>

    <div class="card">
      <div class="card-title">Contactos</div>
      <div id="cont-container">${contHTML}</div>
      <button class="add-field-btn" onclick="addCont()">+ Agregar contacto</button>
    </div>

    <div class="card">
      <div class="card-title">ART contratada</div>
      <label style="margin-top:0">Nombre de la ART</label>
      <input type="text" value="${esc(formData.artNombre)}" placeholder="Ej: Galeno ART, Federación Patronal, Provincia ART" oninput="formData.artNombre=this.value">
      <label>N° de póliza</label>
      <input type="text" value="${esc(formData.artPoliza)}" placeholder="Número de póliza" oninput="formData.artPoliza=this.value">
      <label>Datos de acceso <span style="font-size:12px;color:#888;font-weight:400">(usuario, contraseña, CUIT, etc.)</span></label>
      <textarea placeholder="Ej: Usuario: 30-12345678-9 / Clave: miClave123&#10;O: user@empresa.com / pass: xxxxx" oninput="formData.artAccesos=this.value">${esc(formData.artAccesos)}</textarea>
      <label>Vencimiento de póliza</label>
      <input type="date" value="${formData.artVto}" oninput="formData.artVto=this.value">
    </div>

    <div class="card">
      <div class="card-title">Visitas</div>
      <div class="field-2">
        <div>
          <label style="margin-top:0">Última visita</label>
          <input type="date" value="${formData.ultimaVisita}" oninput="formData.ultimaVisita=this.value">
        </div>
        <div>
          <label style="margin-top:0">Próxima visita</label>
          <input type="date" value="${formData.proximaVisita}" oninput="formData.proximaVisita=this.value">
        </div>
      </div>
      <label>Frecuencia de visita</label>
      <select onchange="formData.frecuencia=this.value">
        <option value="" ${!formData.frecuencia?'selected':''}>— Seleccionar —</option>
        <option value="Mensual" ${formData.frecuencia==='Mensual'?'selected':''}>Mensual</option>
        <option value="Bimestral" ${formData.frecuencia==='Bimestral'?'selected':''}>Bimestral</option>
        <option value="Trimestral" ${formData.frecuencia==='Trimestral'?'selected':''}>Trimestral</option>
        <option value="Semestral" ${formData.frecuencia==='Semestral'?'selected':''}>Semestral</option>
        <option value="Anual" ${formData.frecuencia==='Anual'?'selected':''}>Anual</option>
        <option value="A demanda" ${formData.frecuencia==='A demanda'?'selected':''}>A demanda</option>
      </select>
    </div>

    <div class="card">
      <div class="card-title">Notas</div>
      <textarea placeholder="Observaciones, instrucciones de acceso, datos útiles del cliente..." oninput="formData.notas=this.value">${esc(formData.notas)}</textarea>
    </div>

    <button class="btn-save" onclick="guardarCliente()">💾 Guardar cliente</button>
    <button class="btn-cancel" onclick="goBack()">Cancelar</button>
  `;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function selColor(i) {
  formData.colorIdx = i;
  renderForm();
}

function addEst() {
  formData.establecimientos.push({nombre:'', direccion:''});
  renderForm();
}
function removeEst(i) {
  formData.establecimientos.splice(i, 1);
  renderForm();
}
function addCont() {
  formData.contactos.push({rol:'', nombre:'', telefono:''});
  renderForm();
}
function removeCont(i) {
  formData.contactos.splice(i, 1);
  renderForm();
}

function guardarCliente() {
  if (!formData.razonSocial.trim()) { alert('La razón social es obligatoria.'); return; }
  if (editIdx !== null) {
    clientes[editIdx] = {...formData};
  } else {
    clientes.push({...formData});
    clienteActual = clientes.length - 1;
  }
  saveClientes(clientes);
  viewHistory = ['lista'];
  document.getElementById('topbar-title').textContent = 'Mis clientes';
  renderLista();
  showView('lista');
}

// ══ INIT ══════════════════════════════════════════════
renderLista();
</script>
</body>
</html>
